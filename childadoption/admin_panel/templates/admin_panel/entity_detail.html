{% extends "admin_panel/base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block page_title %}
    <i class="fas fa-info-circle mr-2"></i>{{ page_title }}
{% endblock %}

{% block content %}
<div class="card shadow-sm border-0">
    <div class="card-body">
        <table class="table table-striped mb-0">
            <tbody>
                {% for label, value in fields %}
                <tr>
                    <th style="width: 220px;">{{ label }}</th>
                    <td>{{ value }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    <div class="card-footer bg-white d-flex justify-content-between">
        <a href="{{ back_url }}" class="btn btn-outline-secondary">Back</a>
        <div class="d-flex">
            <a href="{{ edit_url }}" class="btn btn-outline-primary mr-2">Edit</a>
            <form method="post" action="{{ delete_url }}" onsubmit="return confirm('Are you sure you want to delete this record?');">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-danger">Delete</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
